<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Gürkan Esat Portfolio</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        /* Black background */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000000 !important;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }

        /* Unity container */
        #unity-container {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Unity wrapper */
        .unity-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Fixed 1920x1080 canvas - NO STRETCH */
        #unity-canvas {
            background-color: #000000;
            width: 1920px !important;
            height: 1080px !important;
            display: block;
        }

        /* Footer */
        #unity-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 1920px;
            margin-top: 10px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.7);
            border-radius: 8px;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
        }

        #unity-webgl-logo {
            display: inline-block;
            width: 48px;
            height: 48px;
            background-image: url('TemplateData/webgl-logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            filter: brightness(0) invert(1);
        }

        #unity-build-title {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: #fff;
        }

        #unity-fullscreen-button {
            cursor: pointer;
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.2s ease;
            color: white;
            margin-left: auto;
            border: 1px solid rgba(255,255,255,0.3);
        }

            #unity-fullscreen-button:hover {
                background: rgba(255,255,255,0.3);
                transform: scale(1.05);
            }

        /* Loading bar */
        #unity-loading-bar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        /* Fullscreen prompt - shown on mobile only */
        .mobile-fullscreen-prompt {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10001;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            cursor: pointer;
        }

        .fullscreen-prompt-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        .mobile-fullscreen-prompt h2 {
            font-size: 1.8rem;
            margin: 0.5rem 0;
            font-weight: 600;
        }

        .mobile-fullscreen-prompt p {
            font-size: 1.1rem;
            margin: 0.5rem 0;
            opacity: 0.9;
        }

        .fullscreen-trigger-btn {
            margin-top: 2rem;
            padding: 15px 40px;
            font-size: 1.3rem;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

            .fullscreen-trigger-btn:hover {
                background: rgba(255,255,255,0.3);
                transform: scale(1.05);
            }

        /* Small screens: scale canvas to fit with scroll (NO STRETCH) */
        @media (max-width: 1920px) {
            #unity-canvas {
                width: 100% !important;
                height: auto !important;
                max-width: 1920px;
                max-height: 1080px;
                object-fit: contain;
            }

            #unity-footer {
                width: 100%;
                max-width: 1920px;
            }
        }
    </style>
</head>
<body>
    <!-- Mobile Fullscreen Prompt (only on mobile devices) -->
    <div class="mobile-fullscreen-prompt" id="fullscreenPrompt">
        <div class="fullscreen-prompt-icon">⛶</div>
        <h2>Tap for Fullscreen Experience</h2>
        <p>For the best viewing experience, please enter fullscreen mode</p>
        <button class="fullscreen-trigger-btn" id="fullscreenTriggerBtn">Enter Fullscreen ⛶</button>
        <p style="margin-top: 1.5rem; font-size: 0.8rem; opacity: 0.7;">
            Tap anywhere on the screen
        </p>
    </div>

    <!-- Unity Container -->
    <div id="unity-container">
        <div class="unity-wrapper">
            <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
            <div id="unity-loading-bar">
                <div id="unity-logo"></div>
                <div id="unity-progress-bar-empty">
                    <div id="unity-progress-bar-full"></div>
                </div>
            </div>
            <div id="unity-warning"></div>
            <div id="unity-footer">
                <div id="unity-webgl-logo"></div>
                <div id="unity-build-title">Gürkan Esat Portfolio</div>
                <div id="unity-fullscreen-button">⛶</div>
            </div>
        </div>
    </div>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");
        var fullscreenPrompt = document.getElementById("fullscreenPrompt");
        var fullscreenTriggerBtn = document.getElementById("fullscreenTriggerBtn");

        var unityInstance = null;
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        // Function to enter fullscreen
        function enterFullscreen() {
            var elem = canvas;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        // Function to exit fullscreen
        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }

        // Check and update prompt visibility (mobile only)
        function updatePromptVisibility() {
            if (!isMobile) {
                fullscreenPrompt.style.display = "none";
                return;
            }

            var isCurrentlyFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);

            if (!isCurrentlyFullscreen) {
                // Show prompt on mobile when not in fullscreen
                fullscreenPrompt.style.display = "flex";
            } else {
                // Hide prompt when in fullscreen
                fullscreenPrompt.style.display = "none";
            }
        }

        // Listen to fullscreen change
        document.addEventListener('fullscreenchange', function () {
            updatePromptVisibility();
        });
        document.addEventListener('webkitfullscreenchange', function () {
            updatePromptVisibility();
        });

        // Fullscreen button on prompt
        if (fullscreenTriggerBtn) {
            fullscreenTriggerBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                enterFullscreen();
            });
        }

        // Tap anywhere on prompt to enter fullscreen
        if (fullscreenPrompt) {
            fullscreenPrompt.addEventListener('click', function (e) {
                if (e.target === fullscreenPrompt ||
                    e.target.classList.contains('fullscreen-prompt-icon') ||
                    e.target.tagName === 'P' ||
                    e.target.tagName === 'H2') {
                    enterFullscreen();
                }
            });
        }

        // Regular fullscreen button
        if (fullscreenButton) {
            fullscreenButton.onclick = function () {
                if (unityInstance) {
                    unityInstance.SetFullscreen(1);
                } else {
                    enterFullscreen();
                }
            };
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/v9.1.loader.js";
        var config = {
            dataUrl: buildUrl + "/v9.1.data",
            frameworkUrl: buildUrl + "/v9.1.framework.js",
            codeUrl: buildUrl + "/v9.1.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Gürkan Esat Portfolio",
            productVersion: "0.1",
            showBanner: unityShowBanner,
        };

        if (isMobile) {
            // Mobile device
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=yes, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";

            // Prevent body scroll on mobile
            document.body.style.overflow = "hidden";

            // Show prompt after load
            setTimeout(updatePromptVisibility, 500);

        } else {
            // Desktop style - no auto fullscreen
            canvas.style.width = "1920px";
            canvas.style.height = "1080px";

            // Hide prompt on desktop
            if (fullscreenPrompt) {
                fullscreenPrompt.style.display = "none";
            }
        }

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((instance) => {
                unityInstance = instance;
                loadingBar.style.display = "none";

                // Update prompt after load
                setTimeout(updatePromptVisibility, 500);
            }).catch((message) => {
                alert(message);
            });
        };

        document.body.appendChild(script);

        // Initial check
        setTimeout(updatePromptVisibility, 100);
    </script>
</body>
</html>
